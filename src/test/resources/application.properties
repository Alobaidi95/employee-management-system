spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Auto-create table schema from JPA Entities for testing
spring.jpa.hibernate.ddl-auto=create-drop

# Dummy JWT config - only needs to be well-formed, never used for anything
# real. JwtUtil requires these to be present for the Spring context to boot
# at all (e.g. in contextLoads()), so they can't be left out.
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1rZXktbm90LWZvci1wcm9kdWN0aW9uLXVzZQ==
jwt.expiration=3600000